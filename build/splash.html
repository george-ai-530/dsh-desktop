<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>COWIN Harness Desktop</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #fbfbfb; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 32px;
      }
      .markFrame { display: grid; place-items: center; width: 100%; transform: translateY(-80px); }
      .mark { display: block; width: min(280px, 100%); height: auto; object-fit: contain; }
    </style>
  </head>
  <body>
    <main aria-label="COWIN Harness Desktop">
      <div class="markFrame" aria-hidden="true">
        <!-- build/startup-brand.svg: the official COWIN logo, rendered from
             build/brand/source/cowin-logo.jpg by
             scripts/release/render-official-logo-assets.mjs (see
             build/brand/README.zh.md). -->
        <img class="mark" src="startup-brand.svg" width="742" height="378" alt="" />
      </div>
    </main>
  </body>
</html>
